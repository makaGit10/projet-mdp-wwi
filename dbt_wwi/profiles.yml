wwi:
  target: snowflake
  outputs:
    snowflake:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT') }}"
      user: "{{ env_var('SNOWFLAKE_USER') }}"
      private_key_path: "{{ env_var('SNOWFLAKE_PRIVATE_KEY_PATH') }}"
      role: "{{ env_var('SNOWFLAKE_ROLE') }}"
      warehouse: "{{ env_var('SNOWFLAKE_WAREHOUSE') }}"
      database: "{{ env_var('SNOWFLAKE_DATABASE') }}"
      schema: bronze
      threads: 8
    # Cible locale utilisee uniquement pour tester les modeles sans Snowflake
    duckdb_local:
      type: duckdb
      path: "{{ env_var('DUCKDB_PATH', 'wwi_local.duckdb') }}"
      schema: bronze
      threads: 4
